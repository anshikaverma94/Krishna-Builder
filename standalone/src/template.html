  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];

    var k = variant === "light" ? "#ffffff" : "#4a2370";

  var cleanups = [];

  /* ---------------------------- project browser ---------------------- */
  // Delhi + the NCR towns where we work (Gurugram, Palwal, Sonipat/Kundli, Ghaziabad, Noida, Faridabad)
  var NCR_RE = /\b(delhi|gurugram|gurgaon|palwal|sonipat|kundli|ghaziabad|noida|faridabad)\b/i;

    if (!host) return;

    var status = "completed", rendered = false;
    var counts = {
      completed: all.filter(function (p) { return p.status === "completed"; }).length,
      ongoing: all.filter(function (p) { return p.status === "ongoing"; }).length
    };
    var tabsEl = $("[data-pb-tabs]", host), ind = $("[data-pb-ind]", host);

    var TAB_OFF = "relative min-h-12 px-5 text-sm font-bold uppercase tracking-wider transition-colors text-muted-foreground hover:text-brand sm:px-7";

    function mkTab(id, label) {
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "tab"); b.id = "tab-" + id; b.dataset.status = id;
      b.setAttribute("aria-controls", "project-panel");
      b.innerHTML = label + ' <span class="ml-1 text-muted-foreground">(' + counts[id] + ")</span>";

    window.addEventListener("resize", moveIndicator);
    cleanups.push(function () { window.removeEventListener("resize", moveIndicator); });

    var liCache = {};
    function liFor(p) {
      if (!liCache[p.slug]) {
        var li = document.createElement("li");
        li.innerHTML = projectCard(p);
        bindPointer($("a", li));

        liCache[p.slug] = li;
      }
      return liCache[p.slug];

    function update() {
      // NCR projects are listed first (the sort is stable, so each group keeps its original order)
      var visible = all.filter(function (p) { return p.status === status; })
        .sort(function (x, y) { return (inNCR(y) ? 1 : 0) - (inNCR(x) ? 1 : 0); });

      var before = new Map();

      if (!ul || !panel.contains(ul)) {

  var EMAIL_RE = /^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$/;

  function validateField(name, raw) {
    var v = String(raw == null ? "" : raw).trim();
    switch (name) {
      case "name":
        if (v.length < 2) return "Please enter your name";
        if (v.length > 100) return "Too big: expected string to have <=100 characters";
        return "";
      case "email":
        if (!EMAIL_RE.test(v)) return "Please enter a valid email address";
        if (v.length > 200) return "Too big: expected string to have <=200 characters";
        return "";
      case "phone":
        if (v === "") return "";
        if (v.length > 20) return "Too big: expected string to have <=20 characters";
        if (!PHONE_RE.test(v)) return "Please enter a valid phone number";
        return "";
      case "message":
        if (v.length < 10) return "Please tell us a little more (10+ characters)";
        if (v.length > 3000) return "Too big: expected string to have <=3000 characters";
        return "";
    }
    return "";
  }

  function mailtoFor(values) {
    var to = [company.emails.general];
    if (values.subject === "Tender / bid enquiry") to.push(company.emails.tender);
    var body = "New website enquiry\n\n" +
      "Name: " + values.name + "\nEmail: " + values.email + "\nPhone: " + (values.phone || "—") +
      "\nOrganisation: " + (values.organisation || "—") + "\nSubject: " + values.subject + "\n\n" + values.message;
    return "mailto:" + to.join(",") + "?subject=" + encodeURIComponent("[Website] " + values.subject + " — " + values.name) + "&body=" + encodeURIComponent(body);
  }

  // One sender for every enquiry form: Google Sheet (Apps Script) when ENQUIRY_ENDPOINT is set, else the visitor's email app.
  function sendEnquiry(values) {

        return res.json().catch(function () { return {}; }).then(function (json) {

          return {};

  // Inertia ("lerp") scrolling for mouse wheels; native scrolling everywhere else.
  var smooth = { sync: function () {} };
  (function () {
    if (!FINE || reduceMotion()) return;
    var target = window.scrollY, current = window.scrollY, active = false, lastSet = window.scrollY, lastT = 0;
    var maxY = function () { return document.documentElement.scrollHeight - window.innerHeight; };
    function tick(now) {
      var dt = Math.min(64, now - lastT || 16.7);
      lastT = now;
      // time-based easing: same feel at 30, 60 or 144 fps
      current += (target - current) * (1 - Math.pow(0.9, dt / 16.7));
      if (Math.abs(target - current) < 0.3) { current = target; active = false; }
      lastSet = current;
      window.scrollTo(0, current);
      if (active) requestAnimationFrame(tick);
    }
    window.addEventListener("wheel", function (e) {
      if (e.ctrlKey || menuOpen || modalOpen || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      for (var el = e.target; el && el !== document.body; el = el.parentElement) {
        var s = getComputedStyle(el);
        if (/(auto|scroll)/.test(s.overflowY) && el.scrollHeight > el.clientHeight + 1) return; // let inner scrollers scroll
      }
      e.preventDefault();
      if (!active) { current = window.scrollY; target = current; }
      target = clamp(target + e.deltaY * (e.deltaMode === 1 ? 34 : 1), 0, maxY());
      if (!active) { active = true; lastT = performance.now(); requestAnimationFrame(tick); }
    }, { passive: false });
    // Any scroll we did not cause (keyboard, scrollbar drag, anchor, scrollIntoView) takes over from the inertia.
    window.addEventListener("scroll", function () {
      if (!active || Math.abs(window.scrollY - lastSet) > 2) { active = false; current = target = lastSet = window.scrollY; }
    }, { passive: true });
    smooth.sync = function () { current = target = lastSet = window.scrollY; active = false; };
  })();

  /* ============================ ROUTER ============================= */

  function setMeta(title, description) {
    document.title = title;
    var m = $('meta[name="description"]');
    if (m) m.setAttribute("content", description);
    var og = $('meta[property="og:title"]');
    if (og) og.setAttribute("content", title);
  }
  var DEFAULT_TITLE = SITE_NAME + " — EPC Contractors & Developers, New Delhi";
  var DEFAULT_DESC = "Krishna Builder is an EPC contractor with 30+ years of experience delivering institutional, healthcare, residential and commercial projects across India.";
  var withSite = function (t) { return t + " | " + SITE_NAME; };

  var STATIC_ROUTES = {
    "/": { render: pageHome, title: DEFAULT_TITLE, desc: DEFAULT_DESC },
    "/about": { render: pageAbout, title: withSite("About Us"), desc: "Krishna Builder began operations in 1996 and has grown into a premier EPC contractor serving NBCC, CPWD, IITs, IIMs and other government departments." },
    "/services": { render: pageServices, title: withSite("Services"), desc: "Krishna Builder's eight operations: design build, civil infrastructure, structural steel, interiors, electrical, furniture, billing & measurement and project management." },
    "/projects": { render: pageProjects, title: withSite("Projects"), desc: "Completed and ongoing projects by Krishna Builder: universities, hospitals, residential townships and institutional buildings across India." },
    "/capabilities": { render: pageCapabilities, title: withSite("Capabilities & Clients"), desc: "Krishna Builder's plant and machinery, team strength, financial performance and the government departments and institutions we serve." },
    "/contact": { render: pageContact, title: withSite("Contact"), desc: "Contact Krishna Builder at Ring Road Mall, Rohini, New Delhi. Send an enquiry, call us, or reach the tender cell." }
  };

  function currentPath() {
    var p = (location.hash || "").replace(/^#/, "").split("?")[0] || "/";
    if (p.charAt(0) !== "/") p = "/" + p;
    if (p.length > 1) p = p.replace(/\/+$/, "");
    return p;
  }

  function route() {
    cleanups.forEach(function (fn) { try { fn(); } catch (e) {} });
    cleanups = [];
    setMenu(false);
    closeEnquiry();

    var path = currentPath(), main = $("#main"), html, title = DEFAULT_TITLE, desc = DEFAULT_DESC;
    var match = path.match(/^\/projects\/([^/]+)$/);
    if (STATIC_ROUTES[path]) {
      var r = STATIC_ROUTES[path];
      html = r.render(); title = r.title; desc = r.desc;
    } else if (match && getProject(decodeURIComponent(match[1]))) {
      var p = getProject(decodeURIComponent(match[1]));
      html = pageProject(p);
      title = withSite(p.shortTitle);
      desc = p.title + " Client: " + p.client + ". Location: " + p.location + ".";
    } else {
      html = pageNotFound();
    }
    main.innerHTML = html;
    setMeta(title, desc);
    renderNav(path);
    window.scrollTo({ top: 0, left: 0, behavior: "instant" });
    smooth.sync();
    lastY = 0;
    $("#hdr").classList.remove("hide");
    onScrollFrame();

    initFx(main); initHero(main); initCountUp(main); initBars(main);
    initTimeline(main); initRoadmap(main); initBrowser(main); initForm(main);
  }

  // Page transitions: a gold-edged curtain sweeps up, the page swaps underneath, then it lifts away.
  var navBusy = false, navQueued = false, started = false;
  function go() {
    if (!started) return;
    if (reduceMotion()) { route(); return; }
    if (navBusy) { navQueued = true; return; }
    navBusy = true;
    var c = $("#curtain");
    c.className = "curtain cover";
    setTimeout(function () {
      route();
      c.className = "curtain reveal";
      setTimeout(function () {
        c.className = "curtain";
        navBusy = false;
        if (navQueued) { navQueued = false; go(); }
      }, 620);
    }, 470);
  }

  /* ============================== BOOT ============================= */
  renderStaticChrome();
  $("#menu-toggle").innerHTML = icon("menu", "h-6 w-6");
  $("#menu-toggle").addEventListener("click", function () { setMenu(!menuOpen); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && menuOpen) setMenu(false); });

  // "Skip to content" must not change the route.
  $("#skip-link").addEventListener("click", function (e) {
    e.preventDefault();
    var main = $("#main");
    main.focus();
    main.scrollIntoView();
  });

  // Company profile PDF: decoded from the embedded copy only when someone clicks.
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("[data-download-profile]");
    if (!a) return;
    e.preventDefault();
    var node = document.getElementById("profile-pdf-b64");
    if (!node) return;
    var bin = atob(node.textContent.trim()), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    var dl = document.createElement("a");
    dl.href = url; dl.download = "krishna-builder-profile.pdf";
    document.body.appendChild(dl); dl.click(); dl.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  });

  document.addEventListener("click", function (e) {
    var t = e.target.closest && e.target.closest("[data-open-enquiry]");
    if (t) { e.preventDefault(); openEnquiry(t.getAttribute("data-open-enquiry")); }
  });

  window.addEventListener("hashchange", go);

  // Preloader (first visit of the session only), then the first route renders underneath it.
  var seen = false;
  try { seen = sessionStorage.getItem("kb-seen") === "1"; } catch (e) {}
  if (seen || reduceMotion()) {
    started = true;
    route();
  } else {
    var pl = document.createElement("div");
    pl.className = "preloader";
    pl.setAttribute("aria-hidden", "true");
    pl.innerHTML = logoMark("light", "pl-mark") + '<div class="pl-line"></div>';
    document.body.appendChild(pl);
    setTimeout(function () { started = true; route(); }, 1100);
    setTimeout(function () { pl.classList.add("done"); }, 1250);
    setTimeout(function () { pl.remove(); }, 2200);
    try { sessionStorage.setItem("kb-seen", "1"); } catch (e) {}
  }
})();
</script>
</body>
