<script>
"use strict";
(function () {
  /* ------------------------------------------------------------------
     Configuration
     ------------------------------------------------------------------
     ENQUIRY_ENDPOINT: the original site POSTs enquiries to /api/enquiry
     (a Next.js route that emails them through Resend). A single HTML file
     has no server, so by default the form opens the visitor's email app with
     the enquiry pre-filled. To send enquiries to a backend instead, set this
     to its URL; it receives the same JSON body and answers { ok: true } or
     { error: "..." } exactly like the original route.
     ------------------------------------------------------------------ */
  var ENQUIRY_ENDPOINT = "";

  var company = DATA.company, stats = DATA.stats, particulars = DATA.particulars;
  var about = DATA.about, vision = DATA.vision, leadership = DATA.leadership;
  var nav = DATA.nav, services = DATA.services, projects = DATA.projects;
  var sectors = DATA.sectors, machinery = DATA.machinery, financials = DATA.financials;
  var clientNames = DATA.clientNames, clientStrip = DATA.clientStrip;
  var SITE_NAME = company.name;

  /* ---------------------------- helpers ---------------------------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var reduceMotion = function () { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; };
  var href = function (path) { return "#" + path; };

  var inr = new Intl.NumberFormat("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var nfInt = new Intl.NumberFormat("en-IN");
  var formatLakhs = function (l) { return "₹" + inr.format(l) + " Lakhs"; };
  var formatCrore = function (l) { return "₹" + inr.format(l / 100) + " Cr"; };
  var dateFmt = new Intl.DateTimeFormat("en-IN", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
  var formatDate = function (iso) { return dateFmt.format(new Date(iso + "T00:00:00Z")); };
  var yearOf = function (iso) { return Number(iso.slice(0, 4)); };

  var getProject = function (slug) { return projects.find(function (p) { return p.slug === slug; }); };
  var getProjectImages = function (slug) { return IMAGES[slug] || []; };
  var withCover = function (p) { return Object.assign({}, p, { image: getProjectImages(p.slug)[0] }); };

  /* ------------------------------ icons ---------------------------- */
  function icon(name, cls) {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' +
      (cls || "") + '" aria-hidden="true">' + ICONS[name] + "</svg>";
  }

  /* ------------------------------ logo ----------------------------- */
  // Vector recreation of the Krishna Builder "KB" mark (gold frame + K).
  function logoMark(variant, cls) {
    var k = variant === "light" ? "#ffffff" : "#4a2370";
    return '<svg viewBox="0 0 100 100" class="' + (cls || "") + '" role="img" aria-label="Krishna Builder">' +
      '<g fill="#d9b95e"><rect x="4" y="4" width="92" height="8"/><rect x="4" y="4" width="8" height="92"/><rect x="88" y="4" width="8" height="44"/><rect x="48" y="44" width="48" height="8"/><rect x="88" y="44" width="8" height="52"/><rect x="4" y="88" width="92" height="8"/></g>' +
      '<g fill="' + k + '"><rect x="22" y="24" width="10" height="52"/><polygon points="32,50 64,24 78,24 40,54"/><polygon points="40,46 78,76 64,76 32,56"/></g></svg>';
  }
  function logo(variant) {
    var text = variant === "light" ? "text-white" : "text-brand";
    return '<span class="inline-flex items-center gap-3 ">' + logoMark(variant, "h-10 w-10 shrink-0") +
      '<span class="font-display text-lg font-extrabold uppercase leading-none tracking-wide ' + text + '">Krishna Builder</span></span>';
  }

  /* ------------------------- layout primitives --------------------- */
  var container = function (cls, inner) {
    return '<div class="mx-auto w-full max-w-7xl px-5 sm:px-8 lg:px-12 ' + (cls || "") + '">' + inner + "</div>";
  };
  var reveal = function (cls, inner, delay) {
    return '<div class="reveal ' + (cls || "") + '" style="--d:' + (delay || 0) + 's">' + inner + "</div>";
  };

  function sectionHeading(o) {
    var dark = o.tone === "dark", center = o.align === "center";
    return reveal(center ? "mx-auto max-w-3xl text-center" : "max-w-3xl",
      (o.eyebrow
        ? '<p class="mb-4 flex items-center gap-3 text-xs font-semibold uppercase tracking-[0.2em] ' + (dark ? "text-gold" : "text-gold-deep") + " " + (center ? "justify-center" : "") + '">' +
          '<span class="h-px w-8 bg-gold" aria-hidden="true"></span>' + esc(o.eyebrow) + "</p>"
        : "") +
      '<h2 class="text-3xl font-extrabold sm:text-4xl lg:text-5xl ' + (dark ? "text-white" : "text-brand-ink") + '">' + esc(o.title) + "</h2>" +
      (o.intro
        ? '<p class="mt-5 text-base leading-relaxed sm:text-lg ' + (dark ? "text-white/80" : "text-muted-foreground") + '">' + esc(o.intro) + "</p>"
        : ""));
  }

  var BTN_BASE = "inline-flex min-h-11 items-center justify-center gap-2 rounded-sm px-6 py-3 text-sm font-semibold tracking-wide transition-colors duration-200 disabled:cursor-not-allowed disabled:opacity-60";
  var BTN = {
    primary: "bg-brand text-white hover:bg-brand-ink",
    gold: "bg-gold text-brand-ink hover:bg-[#e6c872]",
    outline: "border border-brand text-brand hover:bg-brand hover:text-white",
    "outline-light": "border border-white/70 text-white hover:bg-white hover:text-brand-ink"
  };
  function button(o) {
    var cls = BTN_BASE + " " + BTN[o.variant || "primary"] + " " + (o.cls || "");
    var h = /^(https?:|tel:|mailto:|#)/.test(o.href) ? o.href : href(o.href);
    return '<a href="' + esc(h) + '" class="' + cls + '" ' + (o.attrs || "") + ">" + o.children + "</a>";
  }

  /* ----------------------------- stat grid ------------------------- */
  function statGrid(list, showDescriptions) {
    var lgCols = { 3: "lg:grid-cols-3", 4: "lg:grid-cols-4", 5: "lg:grid-cols-5" };
    return '<dl class="grid grid-cols-2 gap-px ' + (showDescriptions ? "sm:grid-cols-2" : "sm:grid-cols-3") + " " + (lgCols[list.length] || "lg:grid-cols-4") + '">' +
      list.map(function (s) {
        return '<div class="flex flex-col gap-2 px-5 py-8 bg-brand">' +
          '<dd class="order-1 font-display text-4xl font-extrabold sm:text-5xl"><span class="text-gold" data-countup="' + s.value + '" data-suffix="' + esc(s.suffix) + '">' + s.value + esc(s.suffix) + "</span></dd>" +
          '<dt class="order-2 text-sm font-semibold text-white">' + esc(s.label) + "</dt>" +
          (showDescriptions && s.description ? '<p class="order-3 text-sm leading-relaxed text-white/80">' + esc(s.description) + "</p>" : "") +
          "</div>";
      }).join("") + "</dl>";
  }

  /* --------------------------- project image ----------------------- */
  function projectImage(o) {
    if (o.src) {
      return '<img src="' + o.src + '" alt="' + esc(o.alt) + '" ' + (o.priority ? "" : 'loading="lazy" ') +
        'decoding="async" class="absolute inset-0 h-full w-full object-cover ' + (o.cls || "") + '">';
    }
    return '<div role="img" aria-label="' + esc(o.alt) + ' (photo to be supplied)" class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-brand-ink">' +
      logoMark("light", "h-14 w-14 opacity-90") +
      (o.label ? '<span class="px-4 text-center text-[11px] font-semibold uppercase tracking-[0.2em] text-gold">' + esc(o.label) + "</span>" : "") + "</div>";
  }

  function projectCard(p) {
    var year = p.completedOn ? "Completed " + yearOf(p.completedOn)
      : p.stipulatedCompletion ? "Due " + yearOf(p.stipulatedCompletion) : null;
    return '<a href="' + href("/projects/" + p.slug) + '" class="group block h-full overflow-hidden rounded-sm border border-border bg-surface transition-colors hover:border-brand">' +
      '<div class="relative aspect-[4/3] overflow-hidden bg-muted">' +
      projectImage({ src: p.image, alt: p.shortTitle, label: p.sector, cls: "transition-transform duration-500 ease-out group-hover:scale-105" }) +
      '<span class="absolute left-3 top-3 rounded-sm px-2.5 py-1 text-[11px] font-bold uppercase tracking-wider ' + (p.status === "ongoing" ? "bg-gold text-brand-ink" : "bg-white text-brand-ink") + '">' + p.status + "</span></div>" +
      '<div class="p-5">' +
      '<p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-gold-deep">' + esc(p.sector) + "</p>" +
      '<h3 class="mt-2 text-lg font-bold leading-snug text-brand-ink group-hover:text-brand">' + esc(p.shortTitle) + "</h3>" +
      '<p class="mt-3 flex items-center gap-1.5 text-sm text-muted-foreground">' + icon("map-pin", "h-3.5 w-3.5 shrink-0") + esc(p.location) + "</p>" +
      '<div class="mt-4 flex items-center justify-between border-t border-border pt-4 text-sm">' +
      '<span class="text-muted-foreground">' + (year || "") + "</span>" +
      '<span class="inline-flex min-h-9 items-center gap-1.5 rounded-sm bg-brand px-4 text-sm font-semibold tracking-wide text-white transition-colors duration-200 group-hover:bg-brand-ink">View details ' + icon("arrow-right", "h-4 w-4") + "</span>" +
      "</div></div></a>";
  }

  /* ============================== PAGES ============================ */

  var PROFILE_PDF_AVAILABLE = !!document.getElementById("profile-pdf-b64");
  var HERO_SLUGS = ["iim-nagpur-phase-2-3", "ravindra-bhawan-goa", "nit-delhi-admin-block", "science-academy-jajpur", "iiit-nagpur-campus"];

  function pageHome() {
    var heroImages = HERO_SLUGS.map(function (slug) {
      var src = getProjectImages(slug)[0], p = getProject(slug);
      return src && p ? { src: src, alt: p.shortTitle } : null;
    }).filter(Boolean);
    var heroBg = heroImages.length
      ? '<div class="absolute inset-0 overflow-hidden bg-brand-ink" data-hero id="hero-slides">' +
        '<div class="absolute inset-0 bg-gradient-to-r from-brand-ink/60 via-brand-ink/15 to-transparent lg:via-transparent" data-hero-overlay aria-hidden="true"></div></div>'
      : '<div class="absolute inset-0 overflow-hidden bg-brand-ink" aria-hidden="true">' +
        '<div class="absolute inset-0 opacity-[0.18]" style="background-image:linear-gradient(var(--gold) 1px, transparent 1px),linear-gradient(90deg, var(--gold) 1px, transparent 1px);background-size:72px 72px"></div>' +
        '<div class="absolute -right-24 top-0 h-full w-1/2 -skew-x-12 bg-brand"></div>' +
        '<div class="absolute -right-8 top-0 h-full w-24 -skew-x-12 bg-gold"></div></div>';

    var html = "";
    html += '<section class="on-dark relative isolate overflow-hidden text-white">' + heroBg +
      container("relative flex min-h-[82vh] flex-col justify-center py-24",
        reveal("max-w-3xl [text-shadow:0_2px_16px_rgb(0_0_0/0.55)]",
          '<p class="mb-6 flex items-center gap-3 text-xs font-semibold uppercase tracking-[0.2em] text-gold"><span class="h-px w-10 bg-gold" aria-hidden="true"></span>EPC Contractors · Since ' + company.founded + "</p>" +
          '<h1 class="text-5xl font-extrabold leading-[1.05] sm:text-6xl lg:text-7xl">Building dreams through <span class="text-gold">Construction</span></h1>' +
          '<p class="mt-6 max-w-xl text-lg text-white/85">Over 30 years delivering universities, hospitals, residential townships and institutional buildings for government and private clients across India.</p>' +
          '<div class="mt-10 flex flex-wrap gap-4">' +
          button({ href: "/projects", variant: "gold", children: "View our projects " + icon("arrow-right", "h-4 w-4") }) +
          button({ href: "/contact", variant: "outline-light", children: "Get in touch" }) + "</div>")) +
      "</section>";

    html += '<section aria-label="Krishna Builder at a glance" class="bg-brand-ink">' + container("", statGrid(stats, false)) + "</section>";

    html += '<section class="py-20 sm:py-28">' + container("grid gap-12 lg:grid-cols-12",
      '<div class="lg:col-span-5">' + sectionHeading({ eyebrow: "Who we are", title: "A premier contractor, trusted since 1996" }) + "</div>" +
      reveal("lg:col-span-7",
        '<p class="text-lg leading-relaxed text-foreground/85">' + esc(about.paragraphs[1]) + "</p>" +
        '<p class="mt-5 leading-relaxed text-muted-foreground">' + esc(about.paragraphs[0]) + "</p>" +
        '<a href="#/about" class="mt-8 inline-flex min-h-11 items-center gap-2 font-semibold text-brand hover:text-brand-ink">About Krishna Builder ' + icon("arrow-right", "h-4 w-4") + "</a>")) +
      "</section>";

    html += '<section class="bg-muted py-20 sm:py-28">' + container("",
      sectionHeading({ eyebrow: "What we do", title: "Eight operations, one accountable contractor", intro: "From design and civil works to electrical, interiors and project management, delivered on an efficient EPC basis." }) +
      '<ul class="mt-14 grid gap-px bg-border sm:grid-cols-2 lg:grid-cols-4">' +
      services.map(function (s, i) {
        return '<li class="bg-surface">' + reveal("h-full",
          '<a href="#/services" class="group flex h-full flex-col gap-4 p-7 transition-colors hover:bg-brand">' +
          icon(s.icon, "h-7 w-7 text-brand group-hover:text-gold") +
          '<h3 class="text-lg font-bold text-brand-ink group-hover:text-white">' + esc(s.title) + "</h3></a>", (i % 4) * 0.06) + "</li>";
      }).join("") + "</ul>") + "</section>";

    html += '<section class="py-20 sm:py-28">' + container("",
      '<div class="flex flex-wrap items-end justify-between gap-6">' + sectionHeading({ eyebrow: "Selected work", title: "Featured projects" }) +
      '<a href="#/projects" class="inline-flex min-h-11 items-center gap-2 font-semibold text-brand hover:text-brand-ink">All ' + projects.length + " projects " + icon("arrow-right", "h-4 w-4") + "</a></div>" +
      '<ul class="mt-12 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">' +
      projects.filter(function (p) { return p.featured; }).map(function (p) { return "<li>" + projectCard(withCover(p)) + "</li>"; }).join("") + "</ul>") + "</section>";

    html += '<section class="border-y border-border bg-surface py-14">' + container("",
      '<p class="text-center text-xs font-semibold uppercase tracking-[0.2em] text-muted-foreground">Trusted by government departments and institutions</p>' +
      '<ul class="mt-8 flex flex-wrap items-center justify-center gap-x-10 gap-y-5">' +
      clientStrip.map(function (c) { return '<li class="font-display text-xl font-extrabold text-brand/70">' + esc(c) + "</li>"; }).join("") + "</ul>") + "</section>";

    html += '<section class="on-dark bg-brand py-20 text-white">' + container("flex flex-col items-start justify-between gap-8 lg:flex-row lg:items-center",
      '<div class="max-w-2xl"><h2 class="text-3xl font-extrabold sm:text-4xl">Planning a project? Let’s talk.</h2>' +
      '<p class="mt-4 text-white/85">Send us your requirement or tender enquiry and our team will respond.</p></div>' +
      '<div class="flex flex-wrap gap-4">' + button({ href: "/contact", variant: "gold", children: "Contact us" }) +
      (PROFILE_PDF_AVAILABLE ? button({ href: "#", variant: "outline-light", attrs: "data-download-profile", children: icon("download", "h-4 w-4") + " Company profile (PDF)" }) : "") +
      "</div>") + "</section>";
    return html;
  }

  function buildTimeline() {
    var byYear = new Map();
    projects.forEach(function (p) {
      if (!p.completedOn) return;
      var y = yearOf(p.completedOn);
      byYear.set(y, (byYear.get(y) || []).concat([{ label: p.shortTitle, href: "/projects/" + p.slug }]));
    });
    return [{ year: company.founded, heading: "Operations commence", items: [{ label: "M/s Krishna Builder begins operations as a building contractor." }] }]
      .concat(Array.from(byYear.entries()).sort(function (a, b) { return a[0] - b[0]; })
        .map(function (e) { return { year: e[0], heading: "Projects completed", items: e[1] }; }));
  }

  function timeline(entries) {
    return '<ol class="relative ml-3 border-l border-border pl-10 sm:ml-6 sm:pl-14" data-timeline>' +
      '<span aria-hidden="true" data-timeline-line class="absolute -left-px top-0 h-full w-0.5 origin-top bg-gold" style="transform:scaleY(0)"></span>' +
      entries.map(function (e) {
        return '<li class="relative pb-12 last:pb-0">' +
          '<span aria-hidden="true" class="absolute -left-[3.05rem] top-1.5 h-4 w-4 rounded-full border-2 border-gold bg-background sm:-left-[4.05rem]"></span>' +
          '<p class="font-display text-3xl font-extrabold text-brand">' + e.year + "</p>" +
          '<p class="mt-1 text-sm font-semibold uppercase tracking-wider text-gold-deep">' + esc(e.heading) + "</p>" +
          '<ul class="mt-3 space-y-1.5 text-foreground/85">' +
          e.items.map(function (it) {
            return "<li>" + (it.href ? '<a href="' + href(it.href) + '" class="underline-offset-4 hover:text-brand hover:underline">' + esc(it.label) + "</a>" : esc(it.label)) + "</li>";
          }).join("") + "</ul></li>";
      }).join("") + "</ol>";
  }

  function pageAbout() {
    var html = "";
    var teamStats = stats.filter(function (s) { return s.label !== "Years of experience"; });
    html += '<section class="on-dark bg-brand-ink py-20 sm:py-28">' + container("",
      sectionHeading({ tone: "dark", eyebrow: "About us", title: "Thirty years of building across India", intro: about.paragraphs[1] })) + "</section>";

    html += '<section class="py-20 sm:py-28">' + container("grid gap-12 lg:grid-cols-12",
      '<div class="lg:col-span-5">' + sectionHeading({ eyebrow: "Our story", title: "Since 1996" }) + "</div>" +
      reveal("space-y-5 text-lg leading-relaxed text-foreground/85 lg:col-span-7",
        "<p>" + esc(about.paragraphs[0]) + "</p><p>" + esc(about.paragraphs[2]) + "</p>")) + "</section>";

    html += '<section class="bg-muted py-20 sm:py-28">' + container("",
      sectionHeading({ eyebrow: "Vision & strategy", title: "How we deliver" }) +
      '<ul class="mt-12 grid gap-px bg-border md:grid-cols-2">' +
      vision.map(function (v, i) {
        return '<li class="bg-surface p-7 ' + (i === vision.length - 1 ? "md:col-span-2" : "") + '">' +
          reveal("flex gap-4", icon("circle-check", "mt-1 h-5 w-5 shrink-0 text-gold-deep") + '<p class="text-foreground/90">' + esc(v) + "</p>") + "</li>";
      }).join("") + "</ul>") + "</section>";

    html += '<section class="py-20 sm:py-28">' + container("",
      sectionHeading({ eyebrow: "Leadership", title: "Krishna Builder: Our Team", intro: DATA.teamIntro }) +
      '<ul class="mt-12 grid gap-6 md:grid-cols-3">' +
      leadership.map(function (person, i) {
        var initials = person.name.replace("Mr. ", "").split(" ").map(function (w) { return w[0]; }).join("");
        return "<li>" + reveal("h-full",
          '<div class="h-full border border-border bg-surface p-8">' +
          '<div aria-hidden="true" class="flex h-16 w-16 items-center justify-center bg-brand font-display text-xl font-extrabold text-gold">' + esc(initials) + "</div>" +
          '<h3 class="mt-6 text-xl font-bold text-brand-ink">' + esc(person.name) + "</h3>" +
          '<p class="mt-1 text-sm font-semibold text-gold-deep">' + esc(person.role) + "</p>" +
          (person.bio ? '<p class="mt-4 text-sm leading-relaxed text-muted-foreground">' + esc(person.bio) + "</p>" : "") + "</div>", i * 0.08) + "</li>";
      }).join("") + "</ul>" +
      reveal("", '<p class="mt-10 max-w-4xl leading-relaxed text-muted-foreground">' + esc(DATA.leadershipNote) + "</p>")) + "</section>";

    html += '<section class="on-dark bg-brand-ink py-20 text-white sm:py-28">' + container("",
      sectionHeading({ tone: "dark", eyebrow: "Workforce", title: "A team of 300+ professionals", intro: DATA.workforceNote }) +

  /* =========================== BEHAVIOURS ========================== */

  var cleanups = [];
  var bezier = function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    var cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var sx = function (t) { return ((ax * t + bx) * t + cx) * t; };
    var sy = function (t) { return ((ay * t + by) * t + cy) * t; };
    var dx = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (x) {
      var t = x;
      for (var i = 0; i < 8; i++) {
        var e = sx(t) - x;
        if (Math.abs(e) < 1e-5) break;
        var d = dx(t);
        if (Math.abs(d) < 1e-6) break;
        t -= e / d;
      }
      return sy(t);
    };
  };
  var easeOut = bezier(0.22, 1, 0.36, 1);

  function observeOnce(els, rootMargin, cb) {
    if (!els.length) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { io.unobserve(en.target); cb(en.target); }
      });
    }, { rootMargin: rootMargin });
    els.forEach(function (el) { io.observe(el); });
    cleanups.push(function () { io.disconnect(); });
  }

  function initReveal(root) {
    observeOnce($$(".reveal", root), "0px 0px -60px 0px", function (el) { el.classList.add("in"); });
  }

  function initCountUp(root) {
    if (reduceMotion()) return;
    observeOnce($$("[data-countup]", root), "0px 0px -40px 0px", function (el) {
      var value = Number(el.dataset.countup), suffix = el.dataset.suffix || "";
      var start = performance.now(), dur = 1600, raf;
      var tick = function (now) {
        var p = Math.min(1, (now - start) / dur);
        el.textContent = Math.round(value * easeOut(p)) + suffix;
        if (p < 1) raf = requestAnimationFrame(tick);
      };
      el.textContent = 0 + suffix;
      raf = requestAnimationFrame(tick);
      cleanups.push(function () { cancelAnimationFrame(raf); });
    });
  }

  function initBars(root) {
    observeOnce($$("[data-bar]", root), "0px 0px -40px 0px", function (el) { el.style.height = el.dataset.bar; });
  }

  function initTimeline(root) {
    var ol = $("[data-timeline]", root);
    if (!ol) return;
    var line = $("[data-timeline-line]", ol), ticking = false;
    var update = function () {
      ticking = false;
      var vh = window.innerHeight, r = ol.getBoundingClientRect();
      // framer-motion offset ["start 75%", "end 60%"]
      var p = Math.min(1, Math.max(0, (0.75 * vh - r.top) / (r.height + 0.15 * vh)));
      line.style.transform = "scaleY(" + p + ")";
    };
    var onScroll = function () { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    cleanups.push(function () { window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onScroll); });
    update();
  }

  function initHero(root) {
    var host = $("[data-hero]", root);
    if (!host) return;
    var images = HERO_SLUGS.map(function (slug) {
      var src = getProjectImages(slug)[0], p = getProject(slug);
      return src && p ? { src: src, alt: p.shortTitle } : null;
    }).filter(Boolean);
    var overlay = $("[data-hero-overlay]", host), index = 0, current = null;

    function show(i, first) {
      var slide = document.createElement("div");
      slide.className = "hero-slide" + (first ? " on first" : "");
      slide.innerHTML = '<div class="hero-zoom"><img src="' + images[i].src + '" alt="' + esc(images[i].alt) +
        '" ' + (i === 0 ? "" : 'loading="lazy" ') + 'class="absolute inset-0 h-full w-full object-cover"></div>';
      host.insertBefore(slide, overlay);
      if (!first) { void slide.offsetWidth; slide.classList.add("on"); }
      if (current) {
        var old = current, zoom = old.firstChild;
        zoom.style.transform = getComputedStyle(zoom).transform; // freeze zoom while fading out
        old.classList.remove("on");
        old.classList.add("leaving");
        setTimeout(function () { old.remove(); }, 1250);
      }
      current = slide;
    }
    show(0, true);
    if (images.length > 1 && !reduceMotion()) {
      var id = setInterval(function () { index = (index + 1) % images.length; show(index, false); }, 6500);
      cleanups.push(function () { clearInterval(id); });
    }
  }

  /* ---------------------------- project browser ---------------------- */
  function initBrowser(root) {
    var host = $("[data-browser]", root);
    if (!host) return;
    var all = projects.map(withCover);
    var status = "completed", rendered = false;
    var counts = {
      completed: all.filter(function (p) { return p.status === "completed"; }).length,
      ongoing: all.filter(function (p) { return p.status === "ongoing"; }).length
    };
    var tabsEl = $("[data-pb-tabs]", host);
    var countEl = $("[data-pb-count]", host), panel = $("[data-pb-panel]", host);

    var TAB_ON = "min-h-11 border-b-2 px-5 text-sm font-bold uppercase tracking-wider transition-colors border-gold text-brand";
    var TAB_OFF = "min-h-11 border-b-2 px-5 text-sm font-bold uppercase tracking-wider transition-colors border-transparent text-muted-foreground hover:text-brand";

    function mkTab(id, label) {
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "tab"); b.id = "tab-" + id; b.dataset.status = id;
      b.setAttribute("aria-controls", "project-panel");
      b.innerHTML = label + ' <span class="ml-1 text-muted-foreground">(' + counts[id] + ")</span>";
      b.addEventListener("click", function () { status = id; update(); });
      tabsEl.appendChild(b);
    }
    mkTab("completed", "Completed");
    mkTab("ongoing", "Ongoing");

    var liCache = {};
    function liFor(p) {
      if (!liCache[p.slug]) {
        var li = document.createElement("li");
        li.innerHTML = projectCard(p);
        liCache[p.slug] = li;
      }
      return liCache[p.slug];
    }
    var ul = null;

    function update() {
      var inTab = all.filter(function (p) { return p.status === status; });
      var visible = inTab;

      $$("[role=tab]", tabsEl).forEach(function (b) {
        var on = b.dataset.status === status;
        b.setAttribute("aria-selected", String(on));
        b.className = on ? TAB_ON : TAB_OFF;
      });
      countEl.textContent = "Showing " + visible.length + " of " + inTab.length + " " + status + " projects";
      panel.setAttribute("aria-labelledby", "tab-" + status);

      // FLIP: remember where cards are, re-lay them out, then animate from old to new.
      var before = new Map();
      if (ul) $$("li", ul).forEach(function (li) { before.set(li, li.getBoundingClientRect()); });

      if (visible.length === 0) {
        panel.innerHTML = '<p class="border border-dashed border-border p-10 text-center text-muted-foreground">No projects match these filters.</p>';
        ul = null;
      } else {
        if (!ul || !panel.contains(ul)) {
          panel.innerHTML = "";
          ul = document.createElement("ul");
          ul.className = "grid gap-6 sm:grid-cols-2 lg:grid-cols-3";
          panel.appendChild(ul);
        }
        ul.innerHTML = "";
        visible.forEach(function (p) { ul.appendChild(liFor(p)); });
        if (rendered && !reduceMotion()) {
          $$("li", ul).forEach(function (li) {
            var was = before.get(li);
            if (!was) {
              li.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 250, easing: "ease-out" });
            } else {
              var now = li.getBoundingClientRect(), dx = was.left - now.left, dy = was.top - now.top;
              if (dx || dy) li.animate([{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }], { duration: 250, easing: "ease-out" });
            }
          });
        }
      }
      rendered = true;
    }
    update();
  }

  /* ----------------------------- enquiry form ----------------------- */
  var SUBJECTS = ["General enquiry", "Tender / bid enquiry", "Project enquiry", "Other"];
  // Same rules as src/lib/enquiry-schema.ts (zod), with the same messages.
  var EMAIL_RE = /^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$/;
  var PHONE_RE = /^[+\d][\d\s-]{6,18}$/;
  var FIELD = "mt-2 block min-h-11 w-full rounded-sm border border-input bg-surface px-3 py-2 text-base text-foreground placeholder:text-muted-foreground";

  function validateField(name, raw) {
    var v = String(raw == null ? "" : raw).trim();
    switch (name) {
      case "name":
        if (v.length < 2) return "Please enter your name";
        if (v.length > 100) return "Too big: expected string to have <=100 characters";
        return "";
      case "email":
        if (!EMAIL_RE.test(v)) return "Please enter a valid email address";
        if (v.length > 200) return "Too big: expected string to have <=200 characters";
        return "";
      case "phone":
        if (v === "") return "";
        if (v.length > 20) return "Too big: expected string to have <=20 characters";
        if (!PHONE_RE.test(v)) return "Please enter a valid phone number";
        return "";
      case "message":
        if (v.length < 10) return "Please tell us a little more (10+ characters)";
        if (v.length > 3000) return "Too big: expected string to have <=3000 characters";
        return "";
    }
    return "";
  }

  function mailtoFor(values) {
    var to = [company.emails.general];
    if (values.subject === "Tender / bid enquiry") to.push(company.emails.tender);
    var body = "New website enquiry\n\n" +
      "Name: " + values.name + "\nEmail: " + values.email + "\nPhone: " + (values.phone || "—") +
      "\nOrganisation: " + (values.organisation || "—") + "\nSubject: " + values.subject + "\n\n" + values.message;
    return "mailto:" + to.join(",") + "?subject=" + encodeURIComponent("[Website] " + values.subject + " — " + values.name) + "&body=" + encodeURIComponent(body);
  }

  function initForm(root) {
    var host = $("#enquiry-root", root);
    if (!host) return;
    var submitted = false;

    function showSent(mailto) {
      host.innerHTML = '<div role="status" class="border border-border bg-surface p-8">' + icon("circle-check", "h-8 w-8 text-brand") +
        (mailto
          ? '<h3 class="mt-4 text-2xl font-bold text-brand-ink">Your email is ready to send.</h3>' +
            '<p class="mt-2 text-muted-foreground">Your email app should have opened with your enquiry filled in. Press send there to complete it. If nothing opened, write to <a class="font-semibold text-brand underline underline-offset-4" href="mailto:' + company.emails.general + '">' + company.emails.general + "</a> or call " + esc(company.phones[0].label) + ".</p>" +
            '<button type="button" data-again-mail class="mr-6 mt-6 min-h-11 text-sm font-semibold text-brand underline underline-offset-4">Open email again</button>'
          : '<h3 class="mt-4 text-2xl font-bold text-brand-ink">Thank you, we’ve received your enquiry.</h3><p class="mt-2 text-muted-foreground">Our team will get back to you shortly.</p>') +
        '<button type="button" data-again class="mt-6 min-h-11 text-sm font-semibold text-brand underline underline-offset-4">Send another enquiry</button></div>';
      $("[data-again]", host).addEventListener("click", renderForm);
      var again = $("[data-again-mail]", host);
      if (again) again.addEventListener("click", function () { window.location.href = mailto; });
    }

    function renderForm() {
      submitted = false;
      var err = '<div data-err="%"></div>';
      host.innerHTML = '<form novalidate class="grid gap-6 sm:grid-cols-2" id="enquiry-form">' +
        '<div><label for="name" class="text-sm font-semibold text-brand-ink">Name <span aria-hidden="true">*</span></label>' +
        '<input id="name" name="name" autocomplete="name" class="' + FIELD + '">' + err.replace("%", "name") + "</div>" +
        '<div><label for="email" class="text-sm font-semibold text-brand-ink">Email <span aria-hidden="true">*</span></label>' +
        '<input id="email" name="email" type="email" autocomplete="email" class="' + FIELD + '">' + err.replace("%", "email") + "</div>" +
        '<div><label for="phone" class="text-sm font-semibold text-brand-ink">Phone</label>' +
        '<input id="phone" name="phone" type="tel" autocomplete="tel" class="' + FIELD + '">' + err.replace("%", "phone") + "</div>" +
        '<div><label for="organisation" class="text-sm font-semibold text-brand-ink">Organisation</label>' +
        '<input id="organisation" name="organisation" autocomplete="organization" class="' + FIELD + '"></div>' +
        '<div class="sm:col-span-2"><label for="subject" class="text-sm font-semibold text-brand-ink">Subject</label>' +
        '<select id="subject" name="subject" class="' + FIELD + '">' + SUBJECTS.map(function (s) { return "<option>" + esc(s) + "</option>"; }).join("") + "</select></div>" +
        '<div class="sm:col-span-2"><label for="message" class="text-sm font-semibold text-brand-ink">Message <span aria-hidden="true">*</span></label>' +
        '<textarea id="message" name="message" rows="6" class="' + FIELD + '"></textarea>' + err.replace("%", "message") + "</div>" +
        '<div class="absolute -left-[9999px] h-0 w-0 overflow-hidden" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>' +
        '<div class="sm:col-span-2"><div data-server-error></div>' +
        '<button type="submit" class="' + BTN_BASE + " " + BTN.primary + '" id="enquiry-submit">Send enquiry</button></div></form>';

      var form = $("#enquiry-form", host), submitBtn = $("#enquiry-submit", host);
      var ORDER = ["name", "email", "phone", "message"];

      function setError(name, msg) {
        var input = form.elements[name], slot = $('[data-err="' + name + '"]', form);
        if (!slot) return;
        if (msg) {
          slot.innerHTML = '<p id="' + name + '-error" role="alert" class="mt-1.5 text-sm text-[#b3261e]">' + esc(msg) + "</p>";
          input.setAttribute("aria-invalid", "true");
          input.setAttribute("aria-describedby", name + "-error");
        } else {
          slot.innerHTML = "";
          input.removeAttribute("aria-invalid");
          input.removeAttribute("aria-describedby");
        }
      }

      // Like react-hook-form: validate on submit, then re-validate each field as it changes.
      ORDER.forEach(function (name) {
        form.elements[name].addEventListener("input", function () {
          if (submitted) setError(name, validateField(name, form.elements[name].value));
        });
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        submitted = true;
        var firstBad = null;
        ORDER.forEach(function (name) {
          var msg = validateField(name, form.elements[name].value);
          setError(name, msg);
          if (msg && !firstBad) firstBad = form.elements[name];
        });
        if (firstBad) { firstBad.focus(); return; }
        if (form.elements.website.value.length > 0) return; // honeypot: silently refuse bots

        var values = {
          name: form.elements.name.value.trim(),
          email: form.elements.email.value.trim(),
          phone: form.elements.phone.value.trim(),
          organisation: form.elements.organisation.value.trim(),
          subject: form.elements.subject.value,
          message: form.elements.message.value.trim(),
          website: ""
        };
        var serverSlot = $("[data-server-error]", form);
        serverSlot.innerHTML = "";

        if (!ENQUIRY_ENDPOINT) {
          var url = mailtoFor(values);
          window.location.href = url;
          showSent(url);
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = icon("loader-circle", "h-4 w-4 animate-spin") + " Sending…";
        var fail = function (msg) {
          serverSlot.innerHTML = '<p role="alert" class="mb-4 border border-[#b3261e] bg-[#fdecea] p-4 text-sm text-[#7a1a14]">' + esc(msg) + "</p>";
          submitBtn.disabled = false;
          submitBtn.textContent = "Send enquiry";
        };
        fetch(ENQUIRY_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(values) })
          .then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (json) {
              if (!res.ok) return fail(json.error || "Something went wrong. Please try again.");
              showSent(null);
            });
          })
          .catch(function () { fail("Network error. Please check your connection and try again."); });
      });
    }
    renderForm();
  }

  /* ============================ ROUTER ============================= */

  function setMeta(title, description) {
    document.title = title;
    var m = $('meta[name="description"]');
    if (m) m.setAttribute("content", description);
    var og = $('meta[property="og:title"]');
    if (og) og.setAttribute("content", title);
  }
  var DEFAULT_TITLE = SITE_NAME + " — EPC Contractors & Developers, New Delhi";
  var DEFAULT_DESC = "Krishna Builder is an EPC contractor with 30+ years of experience delivering institutional, healthcare, residential and commercial projects across India.";
  var withSite = function (t) { return t + " | " + SITE_NAME; };

  var STATIC_ROUTES = {
    "/": { render: pageHome, title: DEFAULT_TITLE, desc: DEFAULT_DESC },
    "/about": { render: pageAbout, title: withSite("About Us"), desc: "Krishna Builder began operations in 1996 and has grown into a premier EPC contractor serving NBCC, CPWD, IITs, IIMs and other government departments." },
    "/services": { render: pageServices, title: withSite("Services"), desc: "Krishna Builder's eight operations: design build, civil infrastructure, structural steel, interiors, electrical, furniture, billing & measurement and project management." },
    "/projects": { render: pageProjects, title: withSite("Projects"), desc: "Completed and ongoing projects by Krishna Builder: universities, hospitals, residential townships and institutional buildings across India." },
    "/capabilities": { render: pageCapabilities, title: withSite("Capabilities & Clients"), desc: "Krishna Builder's plant and machinery, team strength, financial performance and the government departments and institutions we serve." },
    "/contact": { render: pageContact, title: withSite("Contact"), desc: "Contact Krishna Builder at Ring Road Mall, Rohini, New Delhi. Send an enquiry, call us, or reach the tender cell." }
  };

  function currentPath() {
    var p = (location.hash || "").replace(/^#/, "").split("?")[0] || "/";
    if (p.charAt(0) !== "/") p = "/" + p;
    if (p.length > 1) p = p.replace(/\/+$/, "");
    return p;
  }

  function route() {
    cleanups.forEach(function (fn) { try { fn(); } catch (e) {} });
    cleanups = [];
    setMenu(false);

    var path = currentPath(), main = $("#main"), html, title = DEFAULT_TITLE, desc = DEFAULT_DESC;
    var match = path.match(/^\/projects\/([^/]+)$/);
    if (STATIC_ROUTES[path]) {
      var r = STATIC_ROUTES[path];
      html = r.render(); title = r.title; desc = r.desc;
    } else if (match && getProject(decodeURIComponent(match[1]))) {
      var p = getProject(decodeURIComponent(match[1]));
      html = pageProject(p);
      title = withSite(p.shortTitle);
      desc = p.title + " Client: " + p.client + ". Location: " + p.location + ".";
    } else {
      html = pageNotFound();
    }
    main.innerHTML = html;
    setMeta(title, desc);
    renderNav(path);
    window.scrollTo({ top: 0, left: 0, behavior: "instant" });

    initHero(main); initReveal(main); initCountUp(main); initBars(main);
    initTimeline(main); initBrowser(main); initForm(main);
  }

  /* ============================== BOOT ============================= */
  renderStaticChrome();
  $("#menu-toggle").innerHTML = icon("menu", "h-6 w-6");
  $("#menu-toggle").addEventListener("click", function () { setMenu(!menuOpen); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && menuOpen) setMenu(false); });

  // "Skip to content" must not change the route.
  $("#skip-link").addEventListener("click", function (e) {
    e.preventDefault();
    var main = $("#main");
    main.focus();
    main.scrollIntoView();
  });

  // Company profile PDF: decoded from the embedded copy only when someone clicks.
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("[data-download-profile]");
    if (!a) return;
    e.preventDefault();
    var node = document.getElementById("profile-pdf-b64");
    if (!node) return;
    var bin = atob(node.textContent.trim()), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    var dl = document.createElement("a");
    dl.href = url; dl.download = "krishna-builder-profile.pdf";
    document.body.appendChild(dl); dl.click(); dl.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  });

  window.addEventListener("hashchange", route);
  route();
})();
</script>
